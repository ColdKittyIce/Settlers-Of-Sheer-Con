function shadeHex(hex, pct) {
  if (!hex || hex.length < 7) return hex;
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const t = pct < 0 ? 0 : 255;
  const p = Math.abs(pct);
  const nr = Math.round((t - r) * p + r);
  const ng = Math.round((t - g) * p + g);
  const nb = Math.round((t - b) * p + b);
  return "#" + [nr, ng, nb].map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, "0")).join("");
}

function uid(n = 6) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < n; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function canAfford(res, cost) {
  return Object.entries(cost).every(([r, n]) => res[r] >= n);
}
function payCost(res, cost) {
  const out = {
    ...res
  };
  Object.entries(cost).forEach(([r, n]) => out[r] -= n);
  return out;
}

function createSFX() {
  let ctx = null;
  let master = null;
  let userVolume = 0.7;
  let muted = false;
  const customSounds = {};
  const installedDefaults = {};
  try {
    const storedVol = localStorage.getItem("landfall-sound-volume");
    if (storedVol !== null) {
      const parsed = parseFloat(storedVol);
      if (!isNaN(parsed)) userVolume = Math.max(0, Math.min(1, parsed));
    }
    muted = localStorage.getItem("landfall-sound-muted") === "true";
    for (const evt of SOUND_EVENTS) {
      const data = localStorage.getItem("landfall-sound-custom-" + evt.id);
      if (data) customSounds[evt.id] = data;
    }
  } catch (e) {
    /* no localStorage available */
  }
  // Detect installed defaults in /sounds/ folder (mp3 → wav fallback)
  if (typeof fetch !== "undefined") {
    for (const evt of SOUND_EVENTS) {
      (function (id) {
        const tryFormat = ext => fetch("sounds/" + id + "." + ext, {
          method: "HEAD"
        }).then(r => {
          if (r.ok) {
            installedDefaults[id] = "sounds/" + id + "." + ext;
            return true;
          }
          return false;
        }).catch(() => false);
        tryFormat("mp3").then(ok => {
          if (!ok) tryFormat("wav");
        });
      })(evt.id);
    }
  }
  function playCustom(eventId) {
    const source = customSounds[eventId] || installedDefaults[eventId];
    if (!source) return false;
    if (muted) return true;
    try {
      const a = new Audio(source);
      a.volume = userVolume;
      a.play().catch(() => {});
    } catch (e) {
      /* ignore */
    }
    return true;
  }
  function applyGain() {
    if (master) master.gain.value = muted ? 0 : userVolume;
  }
  function ensure() {
    if (ctx) {
      if (ctx.state === "suspended") ctx.resume().catch(() => {});
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : userVolume;
    master.connect(ctx.destination);
  }
  function tone({
    type = "sine",
    freq = 440,
    freqEnd,
    dur = 0.15,
    vol = 0.2,
    delay = 0
  }) {
    ensure();
    if (!ctx || !master) return;
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(1, freq), t0);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }
  function noise({
    dur = 0.2,
    vol = 0.15,
    freq = 1200,
    freqEnd,
    type = "lowpass",
    delay = 0
  }) {
    ensure();
    if (!ctx || !master) return;
    const t0 = ctx.currentTime + delay;
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const f = ctx.createBiquadFilter();
    f.type = type;
    f.frequency.setValueAtTime(Math.max(1, freq), t0);
    if (freqEnd) f.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f);
    f.connect(g);
    g.connect(master);
    src.start(t0);
    src.stop(t0 + dur + 0.03);
  }
  return {
    unlock() {
      ensure();
    },
    setVolume(v) {
      userVolume = Math.max(0, Math.min(1, v));
      try {
        localStorage.setItem("landfall-sound-volume", String(userVolume));
      } catch (e) {
        /* no localStorage available */
      }
      applyGain();
    },
    setMuted(m) {
      muted = !!m;
      try {
        localStorage.setItem("landfall-sound-muted", String(muted));
      } catch (e) {
        /* no localStorage available */
      }
      applyGain();
    },
    getVolume() {
      return userVolume;
    },
    getMuted() {
      return muted;
    },
    hasCustom(eventId) {
      return !!customSounds[eventId];
    },
    hasInstalled(eventId) {
      return !!installedDefaults[eventId];
    },
    setCustomSound(eventId, dataUri) {
      if (!dataUri) {
        delete customSounds[eventId];
        try {
          localStorage.removeItem("landfall-sound-custom-" + eventId);
        } catch (e) {
          /* no localStorage available */
        }
        return {
          ok: true
        };
      }
      try {
        localStorage.setItem("landfall-sound-custom-" + eventId, dataUri);
        customSounds[eventId] = dataUri;
        return {
          ok: true
        };
      } catch (e) {
        return {
          ok: false,
          error: e.name === "QuotaExceededError" ? "quota" : "unknown"
        };
      }
    },
    preview(eventId) {
      const data = customSounds[eventId];
      if (!data) return false;
      try {
        const a = new Audio(data);
        a.volume = userVolume;
        a.play().catch(() => {});
        return true;
      } catch (e) {
        return false;
      }
    },
    dice() {
      if (playCustom("dice")) return;
      for (let i = 0; i < 5; i++) noise({
        dur: 0.04,
        vol: 0.16,
        freq: 2200 + Math.random() * 1200,
        freqEnd: 500,
        type: "highpass"
      });
      tone({
        type: "sine",
        freq: 120,
        freqEnd: 70,
        dur: 0.12,
        vol: 0.24,
        delay: 0.22
      });
    },
    // Heavy thud when placing a piece
    build() {
      if (playCustom("build")) return;
      tone({
        type: "sine",
        freq: 100,
        freqEnd: 45,
        dur: 0.18,
        vol: 0.4
      });
      tone({
        type: "triangle",
        freq: 60,
        freqEnd: 40,
        dur: 0.15,
        vol: 0.25,
        delay: 0.005
      });
      noise({
        dur: 0.09,
        vol: 0.22,
        freq: 400,
        freqEnd: 120,
        type: "lowpass"
      });
    },
    accept() {
      if (playCustom("accept")) return;
      tone({
        type: "sine",
        freq: 660,
        dur: 0.09,
        vol: 0.26
      });
      tone({

        freq: 880,
        dur: 0.13,
        vol: 0.26,
        delay: 0.08
      });
    },
    reject() {
      if (playCustom("reject")) return;
      tone({
        type: "square",
        freq: 220,
        dur: 0.1,
        vol: 0.18
      });
      tone({
        type: "square",
        freq: 160,
        dur: 0.14,
        vol: 0.18,
        delay: 0.09
      });
    },
    offer() {
      if (playCustom("offer")) return;
      tone({
        type: "triangle",
        freq: 740,
        dur: 0.08,
        vol: 0.2
      });
    },
    turn() {
      if (playCustom("turn")) return;
      tone({
        type: "sine",
        freq: 523,
        dur: 0.1,
        vol: 0.22
      });
      tone({
        type: "sine",
        freq: 659,
        dur: 0.14,
        vol: 0.22,
        delay: 0.09
      });
    },
    // Steal victim — quick woosh + sting
    steal() {
      if (playCustom("steal")) return;
      noise({
        dur: 0.18,
        vol: 0.2,
        freq: 2400,
        freqEnd: 400,
        type: "bandpass"
      });
      tone({
        type: "sawtooth",
        freq: 260,
        freqEnd: 90,
        dur: 0.26,
        vol: 0.22,
        delay: 0.08
      });
    },
    achievement() {
      if (playCustom("achievement")) return;
      [523, 659, 784, 1047].forEach((f, i) => tone({
        type: "triangle",
        freq: f,
        dur: 0.15,
        vol: 0.24,
        delay: i * 0.1
      }));
    },
    // Victory — big roar-like growl followed by a fanfare
    victory() {
      if (playCustom("victory")) return;
      // Roar: filtered noise growl with pitch sweep
      noise({
        dur: 0.8,
        vol: 0.35,
        freq: 500,
        freqEnd: 200,
        type: "lowpass"
      });
      tone({
        type: "sawtooth",
        freq: 95,
        freqEnd: 55,
        dur: 0.8,
        vol: 0.28
      });
      // Second growl layer with slight wobble via short bursts
      for (let i = 0; i < 6; i++) tone({
        type: "sawtooth",
        freq: 100 - i * 5,
        freqEnd: 70 - i * 4,
        dur: 0.14,
        vol: 0.14,
        delay: 0.1 + i * 0.11
      });
      // Fanfare
      [523, 659, 784, 1047, 1319].forEach((f, i) => tone({
        type: "triangle",
        freq: f,
        dur: 0.22,
        vol: 0.28,
        delay: 0.9 + i * 0.14
      }));
    },
    // Robber moved — descending "heh-heh-heh" cackle
    evilLaugh() {
      if (playCustom("evilLaugh")) return;
      const pitches = [560, 470, 400, 330, 380, 310];
      pitches.forEach((p, i) => {
        tone({
          type: "square",
          freq: p,
          freqEnd: p * 0.85,
          dur: 0.09,
          vol: 0.16,
          delay: i * 0.11
        });
        tone({
          type: "triangle",
          freq: p * 0.5,
          dur: 0.09,
          vol: 0.09,
          delay: i * 0.11
        });
      });
      // Low menacing drone underneath

    currentSet.forEach(key => {

      AXIAL_DIRS.forEach(([dq, dr]) => {

      r
