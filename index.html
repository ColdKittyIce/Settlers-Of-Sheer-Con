function hexagonCoords(radius) {
  const list = [];

    for (let r = -radius; r <= radius; r++) {
      const s = -q - r;
      if (Math.max(Math.abs(q), Math.abs(r), Math.abs(s)) <= radius) list.push({
        q,
        r

    }

  return list;
}
function translateCoords(coords, dq, dr) {

function starCoords() {

  const goldCandidate = shuffledOuter[seaCount];

}

function hexCenter(q, r, size) {
  return {
    x: size * Math.sqrt(3) * (q + r / 2),
    y: size * 1.5 * r

}
function hexCorners(cx, cy, size) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const angle = Math.PI / 180 * (60 * i - 30);
    pts.push({
      x: cx + size * Math.cos(angle),
      y: cy + size * Math.sin(angle)
    });
  }
  return pts;
}
function buildGeometry(coords, size) {
  const vertexMap = new Map();
  const edgeMap = new Map();
  let vId = 0,
    eId = 0;
  const hexes = coords.map((hc, idx) => {
    const {
      x: cx,
      y: cy
    } = hexCenter(hc.q, hc.r, size);
    const corners = hexCorners(cx, cy, size);
    const cornerIds = corners.map(pt => {
      const key = `${Math.round(pt.x * 10)}_${Math.round(pt.y * 10)}`;
      let v = vertexMap.get(key);
      if (!v) {
        v = {
          id: "v" + vId++,
          x: pt.x,
          y: pt.y,
          hexIds: []
        };
        vertexMap.set(key, v);
      }
      v.hexIds.push(idx);
      return v.id;
    });
    const edgeIds = [];
    for (let i = 0; i < 6; i++) {
      const a = cornerIds[i],
        b = cornerIds[(i + 1) % 6];
      const key = a < b ? a + "|" + b : b + "|" + a;
      let e = edgeMap.get(key);
      if (!e) {
        e = {
          id: "e" + eId++,
          v1: a,
          v2: b,
          hexIds: []
        };
        edgeMap.set(key, e);
      }
      e.hexIds.push(idx);
      edgeIds.push(e.id);
    }
    return {
      id: "h" + idx,
      q: hc.q,
      r: hc.r,
      cx,
      cy,
      size,
      cornerIds,
      edgeIds,
      resource: null,
      number: null
    };
  });
  const vertices = Array.from(vertexMap.values());
  const edges = Array.from(edgeMap.values());
  return {
    hexes,
    vertices,
    edges
  };
}
function orderAllBoundaryLoops(edges) {
  const boundary = edges.filter(e => e.hexIds.length === 1);
  const byVertex = new Map();
  boundary.forEach(e => {
    [e.v1, e.v2].forEach(v => {
      if (!byVertex.has(v)) byVertex.set(v, []);
      byVertex.get(v).push(e);
    });
  });
  const visited = new Set();
  const loops = [];
  for (const start of boundary) {
    if (visited.has(start.id)) continue;
    const loop = [];
    let current = start;
    let fromVertex = current.v1;
    while (current && !visited.has(current.id)) {
      loop.push(current);
      visited.add(current.id);
      const nextVertex = current.v1 === fromVertex ? current.v2 : current.v1;
      const candidates = (byVertex.get(nextVertex) || []).filter(e => !visited.has(e.id));
      current = candidates[0];
      fromVertex = nextVertex;
    }
    loops.push(loop);
  }
  return loops;
}
function assignBoard(coords, size, options = {}) {
  const geo = buildGeometry(coords, size);
  const forcedTypes = options.forcedTypes || {};
  const desertCount = options.desertCount ?? 1;
  const forcedIdx = [];
  const goldIdx = [];
  geo.hexes.forEach((h, i) => {
    const key = `${h.q},${h.r}`;
    if (forcedTypes[key]) {
      h.resource = forcedTypes[key];
      forcedIdx.push(i);
      if (forcedTypes[key] === "gold") goldIdx.push(i);
    }
  });
  const openIdx = geo.hexes.map((_, i) => i).filter(i => !forcedIdx.includes(i));
  const nonDesertOpenCount = Math.max(0, openIdx.length - desertCount);
  const scale = nonDesertOpenCount / 18;
  const base = {
    wood: 4,
    wheat: 4,
    sheep: 4,
    brick: 3,
    ore: 3
  };
  const resourcePool = [];
  RES.forEach(r => {
    const count = Math.round(base[r] * scale);
    for (let i = 0; i < count; i++) resourcePool.push(r);
  });
  while (resourcePool.length < nonDesertOpenCount) resourcePool.push(RES[Math.floor(Math.random() * RES.length)]);
  while (resourcePool.length > nonDesertOpenCount) resourcePool.pop();
  for (let i = 0; i < desertCount; i++) resourcePool.push("desert");
  const numberTargetCount = nonDesertOpenCount + goldIdx.length;
  const reps = Math.floor(numberTargetCount / NUMBER_BASE.length);
  let numberPool = [];
  for (let i = 0; i < reps; i++) numberPool.push(...NUMBER_BASE);
  const remainder = numberTargetCount - numberPool.length;
  const extra = shuffle(NUMBER_BASE);
  for (let i = 0; i < remainder; i++) numberPool.push(extra[i % extra.length]);
  const neighborPairs = geo.edges.filter(e => e.hexIds.length === 2).map(e => e.hexIds);
  let placedResources, numberByIdx, desertHexId;
  for (let attempt = 0; attempt < 300; attempt++) {
    placedResources = shuffle(resourcePool);
    const openNonDesert = [];
    openIdx.forEach((hi, k) => {
      if (placedResources[k] !== "desert") openNonDesert.push(hi);
    });
    const numberTargets = shuffle([...goldIdx, ...openNonDesert]);
    const shuffledNums = shuffle(numberPool);
    numberByIdx = new Map();
    numberTargets.forEach((hi, k) => numberByIdx.set(hi, shuffledNums[k]));
    let ok = true;
    for (const [a, b] of neighborPairs) {
      const na = numberByIdx.get(a),
        nb = numberByIdx.get(b);
      if (na && nb && (na === 6 || na === 8) && (nb === 6 || nb === 8)) {
        ok = false;
        break;
      }
    }
    if (ok) break;
  }
  openIdx.forEach((hi, k) => {
    geo.hexes[hi].resource = placedResources[k];
    if (placedResources[k] === "desert") desertHexId = geo.hexes[hi].id;
  });
  geo.hexes.forEach((h, i) => {
    if (numberByIdx.has(i)) h.number = numberByIdx.get(i);
  });
  if (!desertHexId) desertHexId = geo.hexes[0].id;
  const loops = orderAllBoundaryLoops(geo.edges);
  const totalBoundaryLen = loops.reduce((a, l) => a + l.length, 0) || 1;
  const landCount = geo.hexes.filter(h => h.resource !== "sea").length;
  const portTotal = options.portCount ?? Math.max(5, Math.round(9 * landCount / 19));
  const portTypesBase = ["3:1", "wood", "3:1", "brick", "3:1", "sheep", "wheat", "3:1", "ore"];
  let portTypes = [];
  while (portTypes.length < portTotal) portTypes.push(...portTypesBase);
  portTypes = shuffle(portTypes.slice(0, portTotal));
  const ports = [];
  let typeCursor = 0;
  loops.forEach(loop => {
    const share = Math.max(1, Math.round(portTotal * loop.length / totalBoundaryLen));
    const step = Math.max(2, Math.floor(loop.length / share));
    for (let i = 0; i < share && i * step < loop.length; i++) {
      const e = loop[i * step];
      ports.push({
        edgeId: e.id,
        type: portTypes[typeCursor % portTypes.length],
        vertexIds: [e.v1, e.v2]
      });
      typeCursor += 1;
    }
  });
  return {
    hexes: geo.hexes,
    vertices: geo.vertices,
    edges: geo.edges,
    ports,
    robberHexId: desertHexId

}

/* ============================ GAME LOGIC HELPERS ========================= */

function vertexEdges(board, vertexId) {
  return board.edges.filter(e => e.v1 === vertexId || e.v2 === vertexId);
}
function edgeOtherVertex(edge, vertexId) {
  return edge.v1 === vertexId ? edge.v2 : edge.v1;
}
function buildingAt(board, vertexId) {
  return board.buildings[vertexId] || null;
}
function roadOwnerAt(board, edgeId) {
  return board.roads[edgeId] || null;
}
function isValidSettlementSpot(board, vertexId, playerId, requireRoad) {
  if (buildingAt(board, vertexId)) return false;
  const adjEdges = vertexEdges(board, vertexId);
  for (const e of adjEdges) {
    const other = edgeOtherVertex(e, vertexId);
    if (buildingAt(board, other)) return false;
  }
  if (requireRoad) {
    const connected = adjEdges.some(e => roadOwnerAt(board, e.id) === playerId);
    if (!connected) return false;
  }
  return true;
}
function isValidRoadSpot(board, edgeId, playerId) {
  const edge = board.edges.find(e => e.id === edgeId);
  if (!edge) return false;
  if (roadOwnerAt(board, edgeId)) return false;
  for (const v of [edge.v1, edge.v2]) {
    const b = buildingAt(board, v);
    if (b && b.owner === playerId) return true;
    const others = vertexEdges(board, v).filter(e => e.id !== edgeId);
    if (others.some(e => roadOwnerAt(board, e.id) === playerId) && (!b || b.owner === playerId)) return true;
  }
  return false;
}
function hexResourcesForVertex(board, vertexId) {
  const v = board.vertices.find(x => x.id === vertexId);
  return v ? v.hexIds.map(i => board.hexes[i]) : [];
}
function playerPortRatio(board, playerId, resource) {
  const ownedVertices = Object.entries(board.buildings).filter(([, b]) => b.owner === playerId).map(([vid]) => vid);
  let best = 4;
  board.ports.forEach(p => {
    if (p.vertexIds.some(v => ownedVertices.includes(v))) {
      if (p.type === resource) best = Math.min(best, 2);else if (p.type === "3:1") best = Math.min(best, 3);
    }
  });
  return best;
}
function longestRoadForPlayer(board, playerId) {
  const myEdges = board.edges.filter(e => roadOwnerAt(board, e.id) === playerId);
  if (myEdges.length === 0) return 0;
  const adjByVertex = new Map();
  myEdges.forEach(e => {
    [e.v1, e.v2].forEach(v => {
      if (!adjByVertex.has(v)) adjByVertex.set(v, []);
      adjByVertex.get(v).push(e);
    });
  });
  let best = 0;
  function blocked(vertexId) {
    const b = buildingAt(board, vertexId);
    return b && b.owner !== playerId;
  }
  function dfs(vertexId, usedEdges, length) {
    best = Math.max(best, length);
    const options = (adjByVertex.get(vertexId) || []).filter(e => !usedEdges.has(e.id));
    for (const e of options) {
      const nextV = edgeOtherVertex(e, vertexId);
      if (blocked(nextV) && length > 0) continue;
      usedEdges.add(e.id);
      dfs(nextV, usedEdges, length + 1);
      usedEdges.delete(e.id);
    }
  }
  for (const v of adjByVertex.keys()) {
    if (!blocked(v)) dfs(v, new Set(), 0);else {
      // allow starting AT a foreign settlement's vertex (edge begins there) but cannot pass through
      const opts = adjByVertex.get(v) || [];
      for (const e of opts) {
        const used = new Set([e.id]);
        best = Math.max(best, 1);
        dfs(edgeOtherVertex(e, v), used, 1);
      }
    }
  }
  return best;
}
function computeVictoryPoints(state, player) {
  let vp = 0;
  Object.values(state.board.buildings).forEach(b => {
