<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="1024" height="1183" viewBox="0 0 1024 1183" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Sheer Con hex tile template</title>
  <desc>1024x1183 template. Place artwork on the "Your Art" layer. The red hex outline is the visible boundary in-game; the yellow dashed line is the safe zone.</desc>

  <g id="Background" inkscape:label="Background (delete before export)" inkscape:groupmode="layer" opacity="0.4">
    <defs>
      <pattern id="checker" width="40" height="40" patternUnits="userSpaceOnUse">
        <rect width="40" height="40" fill="#e8e8e8"/>
        <rect width="20" height="20" fill="#c0c0c0"/>
        <rect x="20" y="20" width="20" height="20" fill="#c0c0c0"/>
      </pattern>
    </defs>
    <rect width="1024" height="1183" fill="url(#checker)"/>
  </g>

  <g id="YourArt" inkscape:label="Your Art Here" inkscape:groupmode="layer">
    <!-- Add your artwork on this layer. -->
  </g>

  <g id="Guides" inkscape:label="Guides (hide before export)" inkscape:groupmode="layer" opacity="0.85">
    <polygon points="512.0,0.5 1023.8,296.0 1023.8,887.0 512.0,1182.5 0.2,887.0 0.2,296.0" fill="none" stroke="#e60023" stroke-width="4"/>
    <polygon points="512.0,59.6 972.6,325.6 972.6,857.5 512.0,1123.4 51.4,857.5 51.4,325.6" fill="none" stroke="#f2c94c" stroke-width="2.5" stroke-dasharray="12 8"/>
    <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
      <rect x="232.0" y="559.5" width="560" height="64" fill="rgba(255,255,255,0.9)" rx="8"/>
      <text x="512.0" y="585.5" font-size="22" font-weight="bold" fill="#333">Design inside the yellow dashed hex</text>
      <text x="512.0" y="611.5" font-size="14" fill="#666">Red = hex boundary (clipped). Yellow = safe zone.</text>
    </g>
    <g font-family="Helvetica, Arial, sans-serif" font-size="14">
      <text x="24" y="30" fill="#e60023">Hex boundary</text>
      <text x="24" y="54" fill="#c99a00">Safe zone (recommended)</text>
    </g>
    <text x="1000" y="1141" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#999" text-anchor="end">1024 x 1183 px</text>
    <text x="1000" y="1161" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#999" text-anchor="end">Export as wood.png / brick.png / etc.</text>
  </g>
</svg>
